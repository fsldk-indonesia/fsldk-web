<div class="page-head">
  <h1>{{ isReadonly ? 'Detail Buku' : (editId ? 'Ubah Buku' : 'Tambah Buku') }}</h1>
  <p class="text-muted">{{ pageSubtitle }}</p>
</div>

<div class="form-card">
  <section class="card card-pad form-section-card">
    <p class="form-section-label"><span class="icon-badge sm icon-badge-soft"><app-icon name="file-text" [size]="14" /></span>Informasi Utama</p>
    <div class="form-group"><label class="form-label">Judul Buku</label>
      <input class="form-control form-control-lg" [(ngModel)]="form.bookTitle" [disabled]="isReadonly" placeholder="Tulis judul buku…"></div>
    <div class="grid grid-2">
      <div class="form-group"><label class="form-label">Penulis</label>
        <input class="form-control" [(ngModel)]="form.authorName" [disabled]="isReadonly" placeholder="Nama penulis…"></div>
      <div class="form-group"><label class="form-label">Tipe Penulis</label>
        <app-select [(ngModel)]="form.authorTypeID" [options]="authorTypeOptions()" [disabled]="isReadonly" placeholder="Pilih tipe penulis" />
      </div>
    </div>
    <div class="grid grid-2">
      <div class="form-group"><label class="form-label">Penerbit</label>
        <input class="form-control" [(ngModel)]="form.publisherName" [disabled]="isReadonly" placeholder="Nama penerbit…"></div>
      <div class="form-group"><label class="form-label">Kategori</label>
        <app-select [(ngModel)]="form.bookCategoryID" [options]="categoryOptions()" [disabled]="isReadonly" placeholder="Pilih kategori" />
      </div>
    </div>
  </section>

  <section class="card card-pad form-section-card">
    <p class="form-section-label"><span class="icon-badge sm icon-badge-info"><app-icon name="book-open" [size]="14" /></span>Detail Buku</p>
    <div class="grid grid-2">
      <div class="form-group"><label class="form-label">Bahasa</label>
        <app-select [(ngModel)]="form.languageID" [options]="languageOptions()" [disabled]="isReadonly" placeholder="Pilih bahasa" />
      </div>
      <div class="form-group"><label class="form-label">Ketersediaan</label>
        <app-select [(ngModel)]="form.availabilityTypeID" [options]="availabilityTypeOptions()" [disabled]="isReadonly" placeholder="Pilih ketersediaan" />
      </div>
    </div>
    <div class="grid grid-2">
      <div class="form-group"><label class="form-label">Tahun Terbit</label>
        <input class="form-control" [(ngModel)]="form.year" [disabled]="isReadonly" placeholder="mis. 2023" maxlength="4"></div>
      <div class="form-group"><label class="form-label">Jumlah Halaman</label>
        <input class="form-control" type="number" min="1" [(ngModel)]="form.pages" [disabled]="isReadonly" placeholder="mis. 240"></div>
    </div>
    <div class="grid grid-2">
      <div class="form-group"><label class="form-label">ISBN <span class="text-muted" style="font-weight:400">(opsional)</span></label>
        <input class="form-control" [(ngModel)]="form.isbn" [disabled]="isReadonly" placeholder="Nomor ISBN…"></div>
      <div class="form-group"><label class="form-label">Edisi <span class="text-muted" style="font-weight:400">(opsional)</span></label>
        <input class="form-control" [(ngModel)]="form.edition" [disabled]="isReadonly" placeholder="mis. Cetakan ke-2…"></div>
    </div>
  </section>

  <section class="card card-pad form-section-card">
    <p class="form-section-label"><span class="icon-badge sm icon-badge-ember"><app-icon name="paperclip" [size]="14" /></span>Berkas</p>
    <div class="form-group"><label class="form-label">Sampul Buku</label>
      <app-image-upload [(value)]="form.coverImage" [disabled]="isReadonly" /></div>
    <div class="form-group">
      <label class="form-label">Berkas PDF Buku <span class="text-muted" style="font-weight:400">(opsional)</span></label>
      <p class="form-hint">Pengunjung membaca buku ini lewat berkas PDF, dibuka di tab baru dari halaman detail.</p>
      <app-pdf-upload [(value)]="form.bookPdf" [disabled]="isReadonly" />
    </div>
  </section>

  <section class="card card-pad form-section-card">
    <p class="form-section-label"><span class="icon-badge sm icon-badge-gold"><app-icon name="book" [size]="14" /></span>Deskripsi</p>
    <div class="form-group"><label class="form-label">Deskripsi</label>
      <textarea class="form-control" rows="4" [(ngModel)]="form.description" [disabled]="isReadonly" placeholder="Deskripsi buku…"></textarea></div>
    <div class="form-group"><label class="form-label">Sinopsis <span class="text-muted" style="font-weight:400">(opsional)</span></label>
      <textarea class="form-control" rows="4" [(ngModel)]="form.synopsis" [disabled]="isReadonly" placeholder="Sinopsis buku…"></textarea></div>
    <div class="form-group"><label class="form-label">Tag <span class="text-muted" style="font-weight:400">(opsional, pisahkan dengan koma)</span></label>
      <input class="form-control" [(ngModel)]="form.tags" [disabled]="isReadonly" placeholder="mis. dakwah, motivasi, remaja"></div>
  </section>

  <section class="card card-pad form-section-card">
    <p class="form-section-label"><span class="icon-badge sm icon-badge-info"><app-icon name="search" [size]="14" /></span>SEO</p>
    <div class="grid grid-2">
      <div class="form-group"><label class="form-label">Meta Keywords <span class="text-muted" style="font-weight:400">(opsional)</span></label>
        <input class="form-control" [(ngModel)]="form.metaKeywords" [disabled]="isReadonly"></div>
      <div class="form-group"><label class="form-label">Meta Description <span class="text-muted" style="font-weight:400">(opsional)</span></label>
        <input class="form-control" [(ngModel)]="form.metaDescription" [disabled]="isReadonly"></div>
    </div>
  </section>

  <div class="form-actions">
    <a routerLink="/cms/catalog-books" class="btn btn-ghost">Batal</a>
    @if (!isReadonly) {
      <button class="btn btn-primary" (click)="save()" [disabled]="saving()">
        @if (saving()) { <span class="spinner"></span> } @else { Simpan Buku }
      </button>
    }
  </div>
</div>
