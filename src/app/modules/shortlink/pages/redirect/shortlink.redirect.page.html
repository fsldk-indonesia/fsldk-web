<div class="redirect-wash">
  @if (notFound()) {
    <div class="redirect-card">
      <div class="empty-state is-error error-content">
        <span class="icon-badge lg icon-badge-danger"><app-icon name="link-slash" [size]="26" /></span>
        <h4>Tautan Tidak Ditemukan</h4>
        <p>Shortlink ini tidak valid atau sudah tidak berlaku.</p>
        <a routerLink="/" class="btn btn-primary btn-block">
          <app-icon name="arrow-left" [size]="13" /> Kembali ke Beranda
        </a>
      </div>
    </div>
  } @else {
    <app-page-loader label="Mengalihkan…" [inline]="true" />
  }
</div>
