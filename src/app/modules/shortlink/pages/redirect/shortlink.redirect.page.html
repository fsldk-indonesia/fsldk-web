@if (notFound()) {
  <div class="center-screen text-center">
    <div class="empty-state">
      <span class="icon-badge lg icon-badge-danger" style="margin:0 auto 14px"><app-icon name="error" [size]="28" /></span>
      <h4>Tautan Tidak Ditemukan</h4>
      <p>Shortlink ini tidak valid atau sudah tidak berlaku.</p>
      <a routerLink="/" class="btn btn-primary btn-sm">Kembali ke Beranda</a>
    </div>
  </div>
} @else {
  <app-page-loader label="Mengalihkan…" />
}
