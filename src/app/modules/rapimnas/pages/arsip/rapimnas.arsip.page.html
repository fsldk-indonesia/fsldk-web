@if (loading()) {
  <div class="rp-page-loading">Memuat...</div>
} @else {
  <div class="rp-arsip">
    <div class="rp-arsip-head">
      <div class="rp-arsip-glow" aria-hidden="true"></div>
      <span class="rp-arsip-badge">Pusat Unduhan</span>
      <h1>Arsip &amp; <span class="rp-arsip-title-accent">Dokumen</span></h1>
      <p>Kumpulan berkas publik, aset visual, dan dokumen pendukung RAPIMNAS 1 FSLDK Indonesia 2026</p>
    </div>
    <div class="rp-arsip-list" rpReveal>
      @for (item of visibleResources(); track $index) {
        <div class="rp-arsip-item">
          <div class="rp-arsip-icon"><app-icon [name]="item.iconKey" [size]="32" /></div>
          <div class="rp-arsip-body">
            <h2>{{ item.title }}</h2>
            <p>{{ item.description }}</p>
          </div>
          <a [href]="item.url" target="_blank" rel="noopener noreferrer" class="rp-arsip-btn">
            {{ item.buttonLabel }}
            <span class="rp-arsip-btn-icon"><app-icon name="download" [size]="16" /></span>
          </a>
        </div>
      }
    </div>
  </div>
}
