<div class="page-head"><a routerLink="/cms/news" class="back">← Kembali</a><h1>{{ editId ? 'Ubah Berita' : 'Tambah Berita' }}</h1></div>

<div class="card card-pad form-card">
  <div class="form-group"><label class="form-label">Judul Berita</label>
    <input class="form-control" [(ngModel)]="form.newsTitle" placeholder="Tulis judul berita…"></div>

  <div class="grid grid-2">
    <div class="form-group"><label class="form-label">Kategori</label>
      <app-select [(ngModel)]="form.categoryID" [options]="categoryOptions()" placeholder="Pilih kategori" />
    </div>
    <div class="form-group"><label class="form-label">Status</label>
      <app-select [(ngModel)]="form.status" [options]="statusOptions" [disabled]="!canPublish" />
      @if (!canPublish) { <p class="form-hint">Hanya Editor/Super Admin yang dapat mempublikasikan.</p> }
    </div>
  </div>

  <div class="grid grid-3">
    <div class="form-group"><label class="form-label">Publisher</label>
      <input class="form-control" [(ngModel)]="form.newsPublisher" placeholder="Nama penerbit (opsional)…"></div>
    <div class="form-group"><label class="form-label">Reporter</label>
      <input class="form-control" [(ngModel)]="form.newsReporter" placeholder="Nama reporter…"></div>
    <div class="form-group"><label class="form-label">Editor</label>
      <input class="form-control" [(ngModel)]="form.newsEditor" placeholder="Nama editor (opsional)…"></div>
  </div>

  <div class="form-group"><label class="form-label">Gambar Utama</label>
    <app-image-upload [(value)]="form.newsImage" /></div>
  <div class="form-group"><label class="form-label">Ringkasan</label>
    <input class="form-control" [(ngModel)]="form.newsExcerpt" placeholder="Ringkasan singkat…"></div>
  <div class="form-group"><label class="form-label">Konten</label>
    <app-rich-text-editor [(value)]="form.newsContent" /></div>
  <div class="form-group"><label class="form-check"><input type="checkbox" [(ngModel)]="form.isFeatured"> Jadikan berita unggulan</label></div>

  <div class="flex gap justify-between">
    <a routerLink="/cms/news" class="btn btn-ghost">Batal</a>
    <button class="btn btn-primary" (click)="save()" [disabled]="saving()">
      @if (saving()) { <span class="spinner"></span> } @else { Simpan Berita }
    </button>
  </div>
</div>
