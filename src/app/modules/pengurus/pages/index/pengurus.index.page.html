<div class="page-head">
  <h1>Pengurus</h1>
  <p class="text-muted">Kelola role pengurus (promosi/demosi) untuk kader aktif di organisasi Anda.</p>
</div>

<app-cms-index [config]="config" [dataSource]="dataSource">
  <ng-template #rowTemplate let-item let-isColumnVisible="isColumnVisible">
    <td><strong>{{ item.fullName }}</strong></td>
    @if (isColumnVisible('email')) { <td class="text-muted">{{ item.email }}</td> }
    @if (isColumnVisible('homeOrganizationName')) { <td>{{ item.homeOrganizationName }}</td> }
    @if (isColumnVisible('roleName')) { <td>{{ item.roleName }}</td> }
    <td class="role-cell" (click)="$event.stopPropagation()">
      <app-select
        [options]="roleOptions"
        [ngModel]="item.roleName"
        (ngModelChange)="onRoleChange(item, $event, $event)"
        [disabled]="busyUserID() === item.userID" />
    </td>
  </ng-template>
</app-cms-index>
