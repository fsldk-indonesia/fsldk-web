<div class="page-head">
  <h1>{{ isReadonly ? 'Detail Event' : (editId ? 'Ubah Event' : 'Tambah Event') }}</h1>
  <p class="text-muted">{{ pageSubtitle }}</p>
</div>

<div class="form-card">
  <section class="card card-pad form-section-card">
    <p class="form-section-label"><span class="icon-badge sm icon-badge-soft"><app-icon name="file-text" [size]="14" /></span>Informasi Utama</p>
    <div class="form-group"><label class="form-label">Judul Event</label>
      <input class="form-control form-control-lg" [(ngModel)]="form.eventTitle" [disabled]="isReadonly" placeholder="Nama/judul event…"></div>
    <div class="grid grid-2">
      <div class="form-group"><label class="form-label">Divisi Penyelenggara</label>
        <input class="form-control" [(ngModel)]="form.eventDivision" [disabled]="isReadonly" placeholder="Contoh: FSLDK Nasional"></div>
      <div class="form-group"><label class="form-label">Tag <span class="text-muted" style="font-weight:400">(pisahkan dengan koma)</span></label>
        <input class="form-control" [(ngModel)]="form.tag" [disabled]="isReadonly" placeholder="muktamar,nasional,…"></div>
    </div>
    <div class="form-group"><label class="form-label">Poster / Gambar</label>
      <app-image-upload [(value)]="form.eventImage" [disabled]="isReadonly" /></div>
  </section>

  <section class="card card-pad form-section-card">
    <p class="form-section-label"><span class="icon-badge sm icon-badge-info"><app-icon name="calendar-days" [size]="14" /></span>Jadwal</p>
    <div class="grid grid-3">
      <div class="form-group"><label class="form-label">Tanggal Mulai</label>
        <app-datetime-picker [(ngModel)]="form.startDate" [disabled]="isReadonly" placeholder="Pilih tanggal & waktu…" /></div>
      <div class="form-group"><label class="form-label">Tanggal Selesai</label>
        <app-datetime-picker [(ngModel)]="form.endDate" [disabled]="isReadonly" placeholder="Pilih tanggal & waktu…" /></div>
      <div class="form-group"><label class="form-label">Tutup Pendaftaran</label>
        <app-datetime-picker [(ngModel)]="form.closeRegistDate" [disabled]="isReadonly" placeholder="Pilih tanggal & waktu…" /></div>
    </div>
  </section>

  <section class="card card-pad form-section-card">
    <p class="form-section-label"><span class="icon-badge sm icon-badge-gold"><app-icon name="map-pin" [size]="14" /></span>Lokasi</p>
    <div class="grid grid-2">
      <div class="form-group"><label class="form-label">Kota / Platform</label>
        <input class="form-control" [(ngModel)]="form.location" [disabled]="isReadonly" placeholder="Yogyakarta / Online"></div>
      <div class="form-group"><label class="form-label">Venue / Gedung</label>
        <input class="form-control" [(ngModel)]="form.place" [disabled]="isReadonly" placeholder="Hotel Grand Keisha…"></div>
    </div>
    <div class="form-group"><label class="form-label">Link Google Maps</label>
      <input class="form-control" [(ngModel)]="form.locationLink" [disabled]="isReadonly" placeholder="https://maps.google.com/…"></div>
  </section>

  <section class="card card-pad form-section-card">
    <p class="form-section-label"><span class="icon-badge sm icon-badge-ember"><app-icon name="link" [size]="14" /></span>Pendaftaran &amp; Dokumentasi</p>
    <div class="form-group"><label class="form-label">Link Pendaftaran</label>
      <input class="form-control" [(ngModel)]="form.registrationLink" [disabled]="isReadonly" placeholder="https://bit.ly/daftar-…"></div>
    <div class="grid grid-2">
      <div class="form-group"><label class="form-label">Link Dokumentasi (Drive)</label>
        <input class="form-control" [(ngModel)]="form.documentLink" [disabled]="isReadonly" placeholder="https://drive.google.com/…"></div>
      <div class="form-group"><label class="form-label">Link Presentasi/Materi (Drive)</label>
        <input class="form-control" [(ngModel)]="form.presentationLink" [disabled]="isReadonly" placeholder="https://drive.google.com/…"></div>
    </div>
  </section>

  <section class="card card-pad form-section-card">
    <p class="form-section-label"><span class="icon-badge sm icon-badge-info"><app-icon name="phone" [size]="14" /></span>Contact Person</p>
    <div class="grid grid-2">
      <div class="form-group"><label class="form-label">Nama CP 1</label>
        <input class="form-control" [(ngModel)]="form.nameCp1" [disabled]="isReadonly" placeholder="Nama lengkap…"></div>
      <div class="form-group"><label class="form-label">No WA CP 1 <span class="text-muted" style="font-weight:400">(tanpa +62)</span></label>
        <input class="form-control" [(ngModel)]="form.contactPerson1" [disabled]="isReadonly" placeholder="81234567890"></div>
    </div>
    <div class="grid grid-2">
      <div class="form-group"><label class="form-label">Nama CP 2</label>
        <input class="form-control" [(ngModel)]="form.nameCp2" [disabled]="isReadonly" placeholder="Nama lengkap (opsional)"></div>
      <div class="form-group"><label class="form-label">No WA CP 2</label>
        <input class="form-control" [(ngModel)]="form.contactPerson2" [disabled]="isReadonly" placeholder="81234567890"></div>
    </div>
  </section>

  <section class="card card-pad form-section-card">
    <p class="form-section-label"><span class="icon-badge sm icon-badge-soft"><app-icon name="book-open" [size]="14" /></span>Deskripsi Event</p>
    <div class="form-group"><app-rich-text-editor [(value)]="form.eventContent" [disabled]="isReadonly" /></div>
  </section>

  <section class="card card-pad form-section-card">
    <p class="form-section-label"><span class="icon-badge sm icon-badge-gold"><app-icon name="eye" [size]="14" /></span>Pengaturan Publikasi</p>
    <div class="form-group form-group-tight"><label class="form-check"><input type="checkbox" [(ngModel)]="form.isPublished" [disabled]="isReadonly"> Publikasikan event ini</label></div>
  </section>

  <div class="form-actions">
    <a routerLink="/cms/events" class="btn btn-ghost">Batal</a>
    @if (!isReadonly) {
      <button class="btn btn-primary" (click)="save()" [disabled]="saving()">
        @if (saving()) { <span class="spinner"></span> } @else { Simpan Event }
      </button>
    }
  </div>
</div>
