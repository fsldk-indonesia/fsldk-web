<div class="page-head">
  <h1>Detail Komentar</h1>
  <p class="text-muted">Tinjau isi komentar beserta seluruh balasannya.</p>
</div>

<div class="form-card">
  <section class="card card-pad form-section-card">
    <p class="form-section-label"><span class="icon-badge sm icon-badge-soft"><app-icon name="comments" [size]="14" /></span>Komentar & Balasan</p>
    @if (loading()) {
      <span class="skel skel-line" style="width:60%"></span>
    } @else {
      @if (item(); as c) {
        <app-comment-item [comment]="c" [level]="0" [iconActions]="true" (removed)="onRootRemoved()" />
      } @else {
        <div class="empty-state"><h4>Komentar tidak ditemukan</h4></div>
      }
    }
  </section>

  <div class="form-actions">
    <a routerLink="/cms/comments" class="btn btn-ghost">Batal</a>
  </div>
</div>
