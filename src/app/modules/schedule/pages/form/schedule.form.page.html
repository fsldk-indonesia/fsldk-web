<div class="page-head">
  <h1>{{ isReadonly ? 'Detail Jadwal' : (editId ? 'Ubah Jadwal' : 'Tambah Jadwal') }}</h1>
  <p class="text-muted">{{ pageSubtitle }}</p>
</div>

<div class="form-card">
  <section class="card card-pad form-section-card">
    <p class="form-section-label"><span class="icon-badge sm icon-badge-soft"><app-icon name="file-text" [size]="14" /></span>Informasi Kegiatan</p>
    <div class="form-group"><label class="form-label">Judul Kegiatan</label>
      <input class="form-control form-control-lg" [(ngModel)]="form.title" [disabled]="isReadonly" maxlength="150" placeholder="mis. Kajian Rutin Pekanan"></div>
    <div class="form-group"><label class="form-label">Kategori</label>
      <app-select [(ngModel)]="form.category" [options]="categoryOptions()" [disabled]="isReadonly" placeholder="Pilih kategori" /></div>
    <div class="form-group"><label class="form-label">Deskripsi <span class="text-muted" style="font-weight:400">(opsional)</span></label>
      <textarea class="form-control" rows="4" [(ngModel)]="form.description" [disabled]="isReadonly" maxlength="2000" placeholder="Detail kegiatan…"></textarea></div>
  </section>

  <section class="card card-pad form-section-card">
    <p class="form-section-label"><span class="icon-badge sm icon-badge-info"><app-icon name="calendar-days" [size]="14" /></span>Waktu Pelaksanaan</p>
    <div class="grid grid-2">
      <div class="form-group"><label class="form-label">Tanggal Mulai</label>
        <app-datetime-picker [showTime]="false" [(ngModel)]="form.startDate" [disabled]="isReadonly" placeholder="Pilih tanggal mulai…" /></div>
      <div class="form-group"><label class="form-label">Tanggal Selesai <span class="text-muted" style="font-weight:400">(opsional)</span></label>
        <app-datetime-picker [showTime]="false" [(ngModel)]="form.endDate" [disabled]="isReadonly" placeholder="Pilih tanggal selesai…" /></div>
    </div>
    <label class="allday-row"><input type="checkbox" [(ngModel)]="form.isAllDay" [disabled]="isReadonly" (ngModelChange)="onAllDayChange()"> <span>Sepanjang hari</span></label>
    <div class="grid grid-2">
      <div class="form-group"><label class="form-label">Jam Mulai</label>
        <app-datetime-picker [timeOnly]="true" [(ngModel)]="form.startTime" [disabled]="isReadonly || form.isAllDay" placeholder="Pilih jam mulai…" /></div>
      <div class="form-group"><label class="form-label">Jam Selesai <span class="text-muted" style="font-weight:400">(opsional)</span></label>
        <app-datetime-picker [timeOnly]="true" [(ngModel)]="form.endTime" [disabled]="isReadonly || form.isAllDay" placeholder="Pilih jam selesai…" /></div>
    </div>
  </section>

  <section class="card card-pad form-section-card">
    <p class="form-section-label"><span class="icon-badge sm icon-badge-gold"><app-icon name="map-pin" [size]="14" /></span>Detail Tambahan</p>
    <div class="grid grid-2">
      <div class="form-group"><label class="form-label">Lokasi / Tempat <span class="text-muted" style="font-weight:400">(opsional)</span></label>
        <input class="form-control" [(ngModel)]="form.location" [disabled]="isReadonly" maxlength="200" placeholder="mis. Masjid Kampus lt. 2"></div>
      <div class="form-group"><label class="form-label">Penanggung Jawab / Panitia <span class="text-muted" style="font-weight:400">(opsional)</span></label>
        <input class="form-control" [(ngModel)]="form.organizer" [disabled]="isReadonly" maxlength="150" placeholder="mis. Departemen Kaderisasi"></div>
    </div>
    <div class="grid grid-2">
      <div class="form-group"><label class="form-label">Narahubung <span class="text-muted" style="font-weight:400">(opsional)</span></label>
        <input class="form-control" [(ngModel)]="form.contactPerson" [disabled]="isReadonly" maxlength="100" placeholder="Nama / no. HP"></div>
      <div class="form-group"><label class="form-label">Tautan Info / Pendaftaran <span class="text-muted" style="font-weight:400">(opsional)</span></label>
        <input class="form-control" type="url" [(ngModel)]="form.url" [disabled]="isReadonly" maxlength="300" placeholder="https://…"></div>
    </div>
  </section>

  <div class="form-actions">
    <a routerLink="/cms/schedules" class="btn btn-ghost">Batal</a>
    @if (!isReadonly) {
      <button class="btn btn-primary" (click)="save()" [disabled]="saving()">
        @if (saving()) { <span class="spinner"></span> } @else { Simpan Jadwal }
      </button>
    }
  </div>
</div>
