<section class="section">
  <div class="container">
    <div class="card-wrap">
      @if (loading()) {
        <div class="icon ok"><span class="spinner spinner-dark"></span></div>
        <h2>Memproses Permintaan…</h2>
        <p class="subtitle">Mohon tunggu sebentar.</p>
      } @else if (success()) {
        <div class="icon ok">&#10003;</div>
        <h2>Berhasil Berhenti Berlangganan</h2>
        <p class="subtitle">{{ message() }}</p>
        <a routerLink="/" class="btn btn-primary btn-block">Kembali ke Beranda</a>
      } @else {
        <div class="icon fail">&#10007;</div>
        <h2>Gagal Berhenti Berlangganan</h2>
        <p class="subtitle">{{ message() }}</p>
        <a routerLink="/" class="btn btn-outline btn-block">Kembali ke Beranda</a>
      }
    </div>
  </div>
</section>
